services:
  capital:
    build:
      context: .
      dockerfile: Dockerfile
    image: capital-finanzas:latest
    container_name: MonkeyCount
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - HOST=0.0.0.0
      - PORT=5050
    volumes:
      # Persistencia de datos en la máquina anfitriona
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/data', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

